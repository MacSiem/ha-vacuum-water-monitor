<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VWM — synthetic UX preview</title><style>body{margin:0;background:#eef2f6;font:14px system-ui;color:#172033}header{padding:12px;display:flex;gap:12px;flex-wrap:wrap}main{max-width:100%;margin:0 auto}ha-vacuum-water-monitor{display:block;width:100%}body.dark{background:#10151e;color:#e2e8f0;--primary-background-color:#10151e;--card-background-color:#182231;--primary-text-color:#e2e8f0;--secondary-text-color:#a2b1c4;--divider-color:#354155}</style>
<header><b>Synthetic demo · no Home Assistant connection</b><label>Width <select id="width"><option>320</option><option selected>390</option><option>500</option><option>900</option></select></label><label>Language <select id="language"><option>pl</option><option>en</option></select></label><label>Theme <select id="theme"><option>light</option><option>dark</option></select></label><label>State <select id="state"><option>known</option><option>empty</option><option>learning</option><option>unknown</option></select></label></header><main><ha-vacuum-water-monitor></ha-vacuum-water-monitor></main>
<script src="../ha-vacuum-water-monitor.js"></script><script>
const card=document.querySelector('ha-vacuum-water-monitor');
const device={vacuum_entity:'vacuum.demo',name:'Demo robot',water_total_ml:4000,brand_profile:'roborock_s7_maxv',profile_key:'roborock_s7_maxv',dock_clean_water_sensor:'binary_sensor.demo_clean',dock_dirty_water_sensor:'binary_sensor.demo_dirty',water_shortage_sensor:'binary_sensor.demo_shortage'};
const states={'vacuum.demo':{entity_id:'vacuum.demo',state:'docked',attributes:{friendly_name:'Demo robot',battery_level:88}},'binary_sensor.demo_clean':{entity_id:'binary_sensor.demo_clean',state:'off',attributes:{friendly_name:'Demo clean-water tank'},last_changed:'2026-10-12T10:00:00Z'},'binary_sensor.demo_dirty':{entity_id:'binary_sensor.demo_dirty',state:'off',attributes:{friendly_name:'Demo dirty-water tank'},last_changed:'2026-10-12T10:00:00Z'},'binary_sensor.demo_shortage':{entity_id:'binary_sensor.demo_shortage',state:'off',attributes:{friendly_name:'Demo water-shortage sensor'},last_changed:'2026-10-12T10:00:00Z'}};
let settings={warning_threshold:20,critical_threshold:10,sharing_intro_choice:'not_now'};
card.setConfig({type:'custom:ha-vacuum-water-monitor',devices:[device],show_support:false});
card._hass={states,user:{id:'synthetic',is_admin:true},callWS:async msg=>{if(msg.type.endsWith('/set_settings')){settings={...settings,...msg.patch};return {settings};}throw new Error('Synthetic preview: operation not connected');}};
card._serverReady=true;
function render(){document.body.className=document.querySelector('#theme').value;document.querySelector('main').style.width=document.querySelector('#width').value+'px';card._lang=document.querySelector('#language').value;card._serverState={settings,tank_states:{'vacuum.demo':{last_reset_ts:Date.now()-86400000,used_ml:1400,water_empty_active:document.querySelector('#state').value==='empty',water_anchor_kind:'empty',last_empty_anchor_ts:Date.now()-60000,calibration_factor:1,calibration_samples:2}}};const mode=document.querySelector('#state').value;
card._health={'vacuum.demo':{initialized:mode!=='unknown',tracks_water:true,status:'ok',capacity_ml:4000,model:'Demo model',capacity_source:'model',uncertainty_percent:20,calibration_samples:3,typical_error_percent:8,checks:[],supply:{basis_runs:mode==='learning'?2:8,cleanings_left:mode==='learning'?null:6,days_left:mode==='learning'?null:10}}};
const tank=card._serverState.tank_states['vacuum.demo'];tank.calibration_history=[{ts:Date.now()-86400000,error_percent:-12.3,accepted:true},{ts:Date.now()-3*86400000,error_percent:0,accepted:false,reason:'calibration_sample_incomplete_cycle'},{ts:Date.now()-5*86400000,error_percent:8,accepted:true},{ts:Date.now()-7*86400000,error_percent:-4,accepted:true},{ts:Date.now()-9*86400000,error_percent:null,accepted:false,reason:'calibration_sample_no_refill_since_empty'}];if(mode==='unknown')tank.last_reset_ts=0;
card._lastHtml='';card._render();}
for(const el of document.querySelectorAll('header select'))el.addEventListener('change',render);render();
</script></html>
