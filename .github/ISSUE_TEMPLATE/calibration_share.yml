name: Share calibration summary (anonymous data)
description: Share the calibration summary generated by the card to improve estimates for your robot model.
title: "[calibration] "
labels: ["calibration-share"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve water estimates for your robot model.
        Paste only the summary generated by **Settings → Help improve estimates** in the Vacuum Water Monitor card.
        The summary contains the model, mop system, integration, tank capacity and per-tank calibration results.
        It must not contain entity or device names, identifiers, account data, timestamps, rooms, maps, areas or firmware.
        This issue is public and shows your GitHub username.
  - type: textarea
    id: summary
    attributes:
      label: Calibration summary (JSON)
      description: Generated by the card. Do not add anything else.
      render: json
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I reviewed the summary and agree to publish it under CC BY 4.0 in the vacuum consumption dataset.
          required: true
